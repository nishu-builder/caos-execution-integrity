name: Verify conversations and browser
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify captured agent conversations and their outcomes
        run: python3 trajectories/verify.py
      - name: Check METR study outcomes against the saved evidence
        run: |
          python3 experiments/metr/verify.py --output /tmp/metr-results.json
          diff -u experiments/metr/results.json /tmp/metr-results.json
      - name: Verify the multiagent experiment and clean controls
        run: |
          python3 experiments/collective/verify.py --output /tmp/collective-results.json
          diff -u experiments/collective/results.json /tmp/collective-results.json
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install browser test dependencies
        run: |
          cd trajectories
          npm ci
          npm run build
          git diff --exit-code -- ../docs/trajectories/remote-worker.js ../docs/trajectories/remote-worker.js.LEGAL.txt ../docs/trajectories/THIRD-PARTY.txt ../docs/trajectories/isomorphic-git-source.cjs
          npx playwright install --with-deps chromium
      - name: Test the trajectory browser
        run: |
          python3 -m http.server 18184 --bind 127.0.0.1 --directory docs > /tmp/trajectory-http.log 2>&1 &
          server_pid=$!
          python3 trajectories/test-remote-server.py --port 18191 > /tmp/trajectory-remote.log 2>&1 &
          remote_pid=$!
          trap 'kill "$server_pid" "$remote_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18184/trajectories/ > /dev/null && curl --fail --silent http://127.0.0.1:18191/fixture.json > /dev/null; then break; fi
            sleep 1
          done
          cd trajectories
          npm test

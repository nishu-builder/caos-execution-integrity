<svg xmlns="http://www.w3.org/2000/svg" width="720" height="676" viewBox="0 0 720 676" role="img" aria-labelledby="title desc">
<title id="title">What CAOS records during a conversation</title><desc id="desc">An example bash call creates a model.complete commit declaring the call, a tool.start commit recording its task before dispatch, and a tool.complete commit recording the result. Arrows point backward to Git parents. A conversation commit has a file tree and execution events in its commit message. Source code is referenced through a gitlink to a separate code commit with its own ancestry.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#555" stroke-width="1.4"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#262626;font-size:17px}.small{font-size:15px;fill:#555}.heading{font-size:18px;font-weight:600}.mono{font-family:monospace;font-size:16px}.box{fill:white;stroke:#999;stroke-width:1.2}.arrow{fill:none;stroke:#555;stroke-width:1.4;marker-end:url(#arrow)}.ref{stroke-dasharray:5 5}</style><rect width="720" height="676" fill="white"/>
<text x="24" y="28" class="heading">Several commits can be recorded within one turn</text>
<text x="24" y="53" class="small">A bash call, for example. Solid arrows point to Git parents.</text>
<rect class="box" x="24" y="76" width="184" height="76" rx="3"/><text x="116" y="101" text-anchor="middle">C0: model response</text><text x="116" y="126" text-anchor="middle" class="mono">model.complete</text><text x="116" y="144" text-anchor="middle" class="small">Declares the tool call</text>
<rect class="box" x="268" y="76" width="184" height="76" rx="3"/><text x="360" y="101" text-anchor="middle">C1: task recorded</text><text x="360" y="126" text-anchor="middle" class="mono">tool.start</text><text x="360" y="144" text-anchor="middle" class="small">Before dispatch</text>
<rect x="512" y="76" width="184" height="76" rx="3" fill="#f2f5f7" stroke="#466276"/><text x="604" y="101" text-anchor="middle">C2: result recorded</text><text x="604" y="126" text-anchor="middle" class="mono">tool.complete</text><text x="604" y="144" text-anchor="middle" class="small">Applies accepted changes</text>
<path class="arrow" d="M268 114H214"/><path class="arrow" d="M512 114H458"/>
<text x="24" y="181" class="small">Other events also create commits; they are omitted here.</text>
<line x1="24" y1="202" x2="696" y2="202" stroke="#ddd"/>
<text x="24" y="233" class="heading">C2 and the Git objects it refers to</text>
<rect x="24" y="252" width="672" height="365" rx="3" fill="#fafafa" stroke="#bbb"/>
<text x="44" y="281">Parent hash → C1</text>
<text x="44" y="318" class="heading">Tree hash → conversation files</text>
<rect class="box" x="44" y="333" width="414" height="127" rx="2"/>
<text x="60" y="361"><tspan class="mono">.caos/transcript/</tspan>  messages</text>
<text x="60" y="393">Notes, memories, and other files</text>
<text x="60" y="425"><tspan class="mono">repo/</tspan>  a gitlink to a source commit</text>
<path class="arrow ref" d="M458 421H502"/>
<rect class="box" x="510" y="391" width="162" height="54" rx="2"/>
<text x="591" y="414" text-anchor="middle">Source commit S1</text><text x="591" y="434" text-anchor="middle" class="small">Points to code files</text>
<path class="arrow" d="M591 445V480"/><text x="602" y="469" class="small">parent</text>
<rect class="box" x="510" y="487" width="162" height="39" rx="2"/><text x="591" y="512" text-anchor="middle">Source commit S0</text>
<text x="44" y="493" class="heading">Commit message → execution events</text>
<text x="44" y="527" class="mono">tool.complete</text>
<text x="44" y="554">Tool record: task hash, input, result, proposed changes</text>
<text x="44" y="580">Payload: the tool observation shown to the model</text>
<text x="44" y="603" class="small">These records are in the commit message, outside its file tree.</text>
<text x="24" y="650">Code history and conversation history have separate parent links.</text>

</svg>
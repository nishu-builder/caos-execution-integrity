<svg xmlns="http://www.w3.org/2000/svg" width="720" height="665" viewBox="0 0 720 665" role="img" aria-labelledby="title desc">
<title id="title">Forking a conversation differs from spawning a subagent</title><desc id="desc">A fork commit F has an earlier conversation commit A as its Git parent and keeps its transcript and files. A spawned subagent instead creates a new root under the shared protocol genesis G3, copies selected content without the parent's protocol metadata, and receives a new prompt. Its completion is recorded by the parent. Harvesting applies selected content changes to the parent, without merging the two transcript histories. Solid arrows point to Git parents. Dashed arrows show transfer of content.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#555" stroke-width="1.4"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#262626;font-size:17px}.small{font-size:15px;fill:#555}.heading{font-size:18px;font-weight:600}.mono{font-family:monospace;font-size:16px}.box{fill:white;stroke:#999;stroke-width:1.2}.arrow{fill:none;stroke:#555;stroke-width:1.4;marker-end:url(#arrow)}.ref{stroke-dasharray:5 5}</style><rect width="720" height="665" fill="white"/>
<text x="24" y="28" class="heading">Fork: continue an earlier conversation</text>
<text x="24" y="53" class="small">Solid arrows follow Git ancestry; dashed arrows transfer content.</text>
<rect class="box" x="24" y="78" width="168" height="50" rx="3"/><text x="108" y="109" text-anchor="middle">Earlier commit A</text>
<rect class="box" x="354" y="78" width="198" height="50" rx="3"/><text x="453" y="109" text-anchor="middle">Original continues: B</text>
<path class="arrow" d="M354 103H198"/>
<rect x="354" y="168" width="198" height="50" rx="3" fill="#f2f5f7" stroke="#466276"/><text x="453" y="199" text-anchor="middle">Fork commit F</text>
<path class="arrow" d="M354 193H108V134"/>
<text x="367" y="246" class="small">Keeps the earlier transcript and files.</text>
<text x="24" y="279" class="small">The selected checkpoint must have no active turn.</text>
<line x1="24" y1="301" x2="696" y2="301" stroke="#ddd"/>
<text x="24" y="332" class="heading">Spawn: start a separate agent with selected content</text>
<text x="24" y="360" class="small">Parent conversation (intermediate commits omitted)</text>
<rect class="box" x="24" y="374" width="180" height="50" rx="3"/><text x="114" y="405" text-anchor="middle">P1</text>
<rect class="box" x="270" y="374" width="180" height="50" rx="3"/><text x="360" y="405" text-anchor="middle">P2: spawn recorded</text>
<rect class="box" x="516" y="374" width="180" height="50" rx="3"/><text x="606" y="405" text-anchor="middle">P3: changes applied</text>
<path class="arrow" d="M270 399H210"/><path class="arrow" d="M516 399H456"/>
<path class="arrow ref" d="M114 424V447H360V498"/>
<text x="180" y="440" class="small">Copy files, not transcript</text>
<text x="24" y="487" class="small">Child conversation (intermediate commits omitted)</text>
<rect class="box" x="24" y="505" width="180" height="60" rx="3"/><text x="114" y="529" text-anchor="middle">Protocol root G3</text><text x="114" y="551" text-anchor="middle" class="small">Shared starting point</text>
<rect class="box" x="270" y="505" width="180" height="60" rx="3"/><text x="360" y="529" text-anchor="middle">S0: new conversation</text><text x="360" y="551" text-anchor="middle" class="small">Then a new task prompt</text>
<rect class="box" x="516" y="505" width="180" height="60" rx="3"/><text x="606" y="529" text-anchor="middle">S1: child finishes</text><text x="606" y="551" text-anchor="middle" class="small">Own transcript and files</text>
<path class="arrow" d="M270 535H210"/><path class="arrow" d="M516 535H456"/>
<path class="arrow ref" d="M606 505V430"/>
<text x="593" y="460" text-anchor="end" class="small">Harvest selected</text><text x="593" y="480" text-anchor="end" class="small">file changes</text>
<text x="24" y="600">Harvesting reconciles content; the conversations stay separate.</text>
<text x="24" y="628" class="small">A code merge can have two parents. Conversation commits have one.</text>
<text x="24" y="652" class="small">The parent also records the child’s initial and terminal conversation hashes.</text>
</svg>